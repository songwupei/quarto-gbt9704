name: Render

# 每次推送到 main / PR 时做一次真实渲染自检：
# 只用 TeX Live 自带字体（classoption: [fandol]），不依赖 Windows/方正/WPS 字体。
# 这层 CI 就是为了拦住"在某类机器上编译不过"的回归（例如默认引擎留 lualatex 时
# 无法嵌入系统 CJK 字体、字体缺失导致 METAFONT 中断等）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    name: 渲染自检（XeLaTeX + Fandol）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 物化扩展（解析子模块符号链接）
        run: ./tools/materialize.sh

      - name: 安装 Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 用上游 TeX Live（TinyTeX + tlmgr），与开发机上的 Arch/TeX Live 语义一致；
      # 不用 Debian 的 texlive-* 拆分包（ulem/iftex/fandol 等会被拆到不同包里，
      # 缺什么报什么，与真实使用环境对不上）。
      - name: 安装 TinyTeX（上游 TeX Live）
        uses: r-lib/actions/setup-tinytex@v2

      - name: 安装中文排版所需宏包
        run: |
          tlmgr option repository ctan
          for pkg in ctex fandol zhnumber xecjk ulem alltt caption subcaption \
                     booktabs longtable geometry fancyhdr iftex fcolumn; do
            tlmgr install "$pkg" >/dev/null 2>&1 \
              && echo "✓ $pkg" \
              || echo "⚠ $pkg 未能显式安装（quarto 渲染时会自动补装）"
          done
          xelatex --version | head -1
          kpsewhich FandolFang-Regular.otf

      - name: 渲染 PDF（XeLaTeX · 必过）
        run: |
          quarto render tests/ci-minimal.qmd --to gbt9704-pdf
          test -s tests/ci-minimal.pdf

      - name: 渲染 DOCX / HTML（必过）
        run: |
          quarto render tests/ci-minimal.qmd --to gbt9704-docx
          quarto render tests/ci-minimal.qmd --to gbt9704-html
          test -s tests/ci-minimal.docx
          test -s tests/ci-minimal.html

      - name: 渲染 PDF · LuaLaTeX（只预警，不阻断）
        continue-on-error: true
        run: |
          quarto render tests/ci-minimal.qmd --to gbt9704-pdf \
            -M classoption=fandol -M pdf-engine=lualatex

      - name: 上传渲染产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-render
          path: tests/ci-minimal.*
          if-no-files-found: warn
