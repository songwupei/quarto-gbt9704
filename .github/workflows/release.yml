name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Materialize extension (resolve symlinks)
        run: ./tools/materialize.sh

      - name: Publish materialized extension to dist branches
        env:
          CODEBERG_DEPLOY_KEY: ${{ secrets.CODEBERG_DEPLOY_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 构建 dist 孤儿分支:只含物化后的 _extensions/
          git worktree add --detach dist-wt HEAD
          cd dist-wt
          git checkout --orphan dist
          git rm -rf --quiet .
          cp -r "$GITHUB_WORKSPACE/_extensions" .
          # 剔除会话残留目录（本地运行痕迹，不应进入发布产物）
          find . -type d \( -name .omc -o -name .claude \) -exec rm -rf {} + 2>/dev/null || true
          git add -A
          git commit -m "release: materialized extension (${GITHUB_REF_NAME})"

          # 推送 GitHub
          git push -f origin dist

          # 推送 Codeberg(deploy key)
          echo "$CODEBERG_DEPLOY_KEY" > /tmp/codeberg_key
          chmod 600 /tmp/codeberg_key
          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i /tmp/codeberg_key -o IdentitiesOnly=yes"
          git push -f ssh://git@codeberg.org/songwupei/quarto-gbt9704.git dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
